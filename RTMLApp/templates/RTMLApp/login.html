{% extends "RTMLApp/index.html"%}

{% block content %}
<br><br>
    <div class="container" style="width:350px">
        <form method="POST">
            {% csrf_token %}
            <div class="form-group pb-3">
                <i class="bi bi-person-circle"></i> Username:
                {{ form.username }}
            </div>
            <div class="form-group pb-3">
                <i class="bi bi-key-fill"></i> Password:
                {{ form.password }}
            </div>
            <div class="form-group col text-center">
                <button class="btn btn-lg btn-outline-success" type="submit">Login</button>
            </div>
        </form>
    </div>

{% endblock %}
